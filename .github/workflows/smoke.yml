name: Smoke tests (productie)

on:
  # Na elke push naar main (dus na elke merge) — vangt een kapotte deploy
  # vroeg op, zoals de eerdere subdomein-routing bug.
  push:
    branches: [main]
  # Elke 3 uur, los van deploys — dit is tegelijk de "monitoring"-laag:
  # als lifegix.nl zelf om een andere reden stuk gaat (bijv. een verlopen
  # API-sleutel), faalt deze run en krijgt de repo-eigenaar een mail van
  # GitHub (standaardgedrag bij een mislukte workflow-run).
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests tegen productie
        run: npx playwright test

      - name: Upload testrapport bij een mislukte run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
