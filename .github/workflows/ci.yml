name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Enige env var die de build zelf nodig heeft (zie src/lib/token.ts) —
          # de waarde hoeft niet gelijk te zijn aan Production/Preview in Vercel,
          # hij wordt alleen gebruikt om de build zelf te laten slagen.
          INTAKE_TOKEN_SECRET: ${{ secrets.INTAKE_TOKEN_SECRET }}
